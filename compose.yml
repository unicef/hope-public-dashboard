x-env: &env
  environment:
    - ADMIN_EMAIL=admin@example.com
    - ADMIN_PASSWORD=password
    - ALLOWED_HOSTS=*
    - CELERY_BROKER_URL=redis://redis:6379/3
    - CELERY_RESULT_BACKEND=redis://redis:6379/3
    - CSRF_COOKIE_SECURE=False
    - CSRF_TRUSTED_ORIGINS=http://localhost:8000
    - DATABASE_URL=postgres://postgres:password@db:5432/hope_dashboard
    - DEBUG=1
    - DJANGO_ADMIN_URL=admin/
    - DJANGO_SETTINGS_MODULE=hope_dashboard.config.settings
    - FERNET_KEY=123
    - LOGGING_LEVEL=DEBUG
    - POSTGRES_DB=hope_dashboard
    - POSTGRES_HOST_AUTH_METHOD=trust
    - POSTGRES_USER=postgres
    - REDIS_CACHE_URL=redis://redis:6379/0
    - REDIS_LOCK_URL=redis://redis:6379/1?backend=django_redis.cache.RedisCache
    - REDIS_TSDB_URL=redis://redis:6379/2
    - REDIS_URL=redis://redis:6379/3
    - SECRET_KEY=super-secret-key-just-for-testing
    - SESSION_COOKIE_DOMAIN=http://localhost:8000
    - SOCIAL_AUTH_REDIRECT_IS_HTTPS=False

services:
  app:
    image: unicef/hope-public-dashboard:local
    <<: [*env]
    ports:
      - 8000:8000
    platform: linux/amd64
    command: "run"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthcheck/"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: unicef/hope-public-dashboard:local
    <<: [*env]
    platform: linux/amd64
    command: "worker"
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: unicef/hope-public-dashboard:local
    <<: [*env]
    platform: linux/amd64
    command: "beat"
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16
    <<: [*env]
    restart: always
    platform: linux/amd64
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "hope_dashboard"]
      start_period: 5s
      start_interval: 1s
      interval: 5s
      timeout: 4s
      retries: 5

  redis:
    image: redis:7
    platform: linux/amd64
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 4s
      retries: 5

volumes:
  postgres_data:
