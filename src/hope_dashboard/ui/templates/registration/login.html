{% extends "layout.html" %}
{% load i18n %}
{% block menu %}
{% endblock menu %}
{% block page %}
    <div class="flex min-h-[60vh] flex-col items-center justify-center px-4">
        <h1 class="text-3xl font-bold">{% translate "HOPE Public Dashboard" %}</h1>
        <form action="{% url 'social:begin' 'azuread-tenant-oauth2' %}" method="post" class="mt-8">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary">{% translate "Login with Azure" %}</button>
        </form>
        <p class="mt-4 text-sm text-base-content/60">{% translate "Use your UNICEF account to continue." %}</p>
    </div>
{% endblock page %}
