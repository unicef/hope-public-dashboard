name: Docker publish

on:
  push:
    branches:
      - develop
      - feature/publicpage
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: unicef/hope-public-dashboard

jobs:
  build:
    name: "Build and publish image"
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate build metadata
        id: config
        run: |
          version=$(uvx --with hatch-vcs hatchling metadata version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=HOPE Public Dashboard
            org.opencontainers.image.description=UNICEF HOPE Public Dashboard
            org.opencontainers.image.vendor=UNICEF
            org.opencontainers.image.source=https://github.com/unicef/hope-public-dashboard

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.config.outputs.version }}
            BUILD_DATE=${{ steps.config.outputs.build_date }}
            GIT_SHA=${{ github.sha }}

  deploy:
    name: "Trigger deployment"
    if: github.ref == 'refs/heads/develop' && vars.AZURE_PIPELINE_ID_DEVELOP != ''
    needs:
      - build
    uses: ./.github/workflows/trigger-azure-pipeline.yml
    with:
      azure-organization: ${{ vars.AZURE_ORGANIZATION }}
      azure-project: ${{ vars.AZURE_PROJECT }}
      azure-pipeline-id: ${{ vars.AZURE_PIPELINE_ID_DEVELOP }}
      image-tag: develop
    secrets:
      azure-pat: ${{ secrets.AZURE_PAT }}
